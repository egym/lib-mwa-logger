name: Publish package to npmjs
on:
  release:
    types: [published]
permissions:
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - run: npm publish --provenance
